<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>دفتر الحساب — إدارة العمال</title>
    <meta name="description" content="تطبيق لإدارة حسابات العمال اليومية: الأجور، السحوبات، الغرامات، المقدمات، والدفعات.">
    <meta name="theme-color" content="#16222B">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="دفتر الحساب">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
        /* ============================================================
           دفتر الحساب — نظام تصميم متكامل 2025
           ============================================================ */
        :root{
          /* ألوان الوضع الداكن */
          --bg-dark:#0A0E17;
          --bg2-dark:#0F1625;
          --bg3-dark:#151E30;
          --surface-dark:rgba(21,30,48,.75);
          --surface2-dark:rgba(30,41,63,.55);
          --border-dark:rgba(255,255,255,.08);
          --border2-dark:rgba(255,255,255,.05);
          --text-dark:#F1F5F9;
          --text2-dark:#94A3B8;
          --text3-dark:#64748B;

          /* ألوان الوضع الفاتح */
          --bg-light:#F8FAFC;
          --bg2-light:#FFFFFF;
          --bg3-light:#F1F5F9;
          --surface-light:rgba(255,255,255,.92);
          --surface2-light:rgba(241,245,249,.85);
          --border-light:#E2E8F0;
          --border2-light:#F1F5F9;
          --text-light:#0F172A;
          --text2-light:#475569;
          --text3-light:#94A3B8;

          /* ألوان مميزة */
          --gold:#D4AF37;
          --gold2:#F5D77A;
          --gold3:#B8941F;
          --gold-soft:rgba(212,175,55,.15);
          --accent:#8B5CF6;
          --accent2:#A78BFA;
          --accent-soft:rgba(139,92,246,.18);
          --green:#10B981;
          --green2:#34D399;
          --green-soft:rgba(16,185,129,.16);
          --red:#EF4444;
          --red2:#F87171;
          --red-soft:rgba(239,68,68,.16);
          --blue:#3B82F6;
          --blue2:#60A5FA;
          --blue-soft:rgba(59,130,246,.16);

          /* متغيرات نشطة (تتغير حسب الوضع) */
          --bg:var(--bg-dark);
          --bg2:var(--bg2-dark);
          --bg3:var(--bg3-dark);
          --surface:var(--surface-dark);
          --surface2:var(--surface2-dark);
          --border:var(--border-dark);
          --border2:var(--border2-dark);
          --text:var(--text-dark);
          --text2:var(--text2-dark);
          --text3:var(--text3-dark);

          --radius-sm:10px;
          --radius:16px;
          --radius-lg:22px;
          --radius-xl:30px;
          --radius-full:999px;
          --shadow-sm:0 2px 6px rgba(0,0,0,.3);
          --shadow-md:0 8px 20px rgba(0,0,0,.35);
          --shadow-lg:0 16px 40px rgba(0,0,0,.45);
          --shadow-xl:0 24px 56px rgba(0,0,0,.55);
          --shadow-gold:0 8px 24px rgba(212,175,55,.3);
          --shadow-accent:0 8px 24px rgba(139,92,246,.35);
          --shadow-green:0 8px 24px rgba(16,185,129,.3);
          --shadow-red:0 8px 24px rgba(239,68,68,.3);
          --ease:cubic-bezier(.22,.85,.35,1);
          --ease-spring:cubic-bezier(.34,1.45,.4,1);
          --font-ar:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
        }

        /* الوضع الفاتح */
        body.light-mode{
          --bg:var(--bg-light);
          --bg2:var(--bg2-light);
          --bg3:var(--bg3-light);
          --surface:var(--surface-light);
          --surface2:var(--surface2-light);
          --border:var(--border-light);
          --border2:var(--border2-light);
          --text:var(--text-light);
          --text2:var(--text2-light);
          --text3:var(--text3-light);
          --shadow-sm:0 1px 3px rgba(15,23,42,.08);
          --shadow-md:0 4px 12px rgba(15,23,42,.10);
          --shadow-lg:0 20px 40px rgba(15,23,42,.16);
          --shadow-xl:0 28px 56px rgba(15,23,42,.24);
        }

        *{box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
        html,body{margin:0;padding:0;}
        body{
          background: #16222B;
          color:var(--text);
          font-family: 'Tajawal', sans-serif;
          font-variant-numeric:tabular-nums;
          min-height:100vh;
          -webkit-tap-highlight-color:transparent;
          transition:background .3s var(--ease), color .3s var(--ease);
        }
        #bg-layer{position:fixed;inset:0;z-index:-1;background-color:#16222B;background-size:cover;background-position:center;background-repeat:no-repeat;}
        #app-root{max-width:560px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:110px;}
        h1,h2,h3{margin:0;font-family:var(--font-ar);}
        .hidden{display:none !important;}
        button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
        button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold2);outline-offset:2px;border-radius:6px;}
        input,select,textarea{font-family:inherit;color:var(--text);}
        ::selection{background:var(--gold-soft);color:var(--gold2);}
        svg{display:block;}
        @media (prefers-reduced-motion: reduce){
          *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
        }

        /* ===== Top bar ===== */
        .topbar{
          position:sticky;top:0;z-index:20;
          background:rgba(10,14,23,.82);
          backdrop-filter:blur(24px);
          -webkit-backdrop-filter:blur(24px);
          border-bottom:1px solid var(--border);
          padding:18px 16px 15px;
          box-shadow:0 4px 24px rgba(0,0,0,.3);
          transition:all .3s var(--ease);
        }
        body.light-mode .topbar{
          background:rgba(255,255,255,.88);
          box-shadow:0 4px 20px rgba(15,23,42,.06);
        }
        .topbar::before{
          content:"";
          position:absolute;top:0;left:16px;right:16px;height:1px;
          background:linear-gradient(90deg, transparent, rgba(212,175,55,.5), transparent);
        }
        .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
        .topbar h1{font-size:20px;font-weight:900;color:var(--text);letter-spacing:-.3px;}
        .topbar .sub{font-size:11px;color:var(--text3);margin-top:2px;font-weight:600;}
        .icon-btn{
          width:38px;height:38px;border-radius:12px;background:var(--surface);
          border:1px solid var(--border);
          display:flex;align-items:center;justify-content:center;color:var(--text2);flex-shrink:0;
          box-shadow:var(--shadow-sm);
          transition:all .15s var(--ease);
        }
        .icon-btn:active{background:var(--surface2);transform:scale(.9);}
        .topbar-actions{display:flex;gap:8px;}
        .search-wrap{margin-top:13px;position:relative;}
        .search-wrap .search-ic{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:13px;color:var(--text3);pointer-events:none;display:flex;}
        .search-wrap input{
          width:100%;padding:11px 40px 11px 14px;border-radius:12px;border:1px solid var(--border);
          background:var(--surface);color:var(--text);font-size:14px;
          transition:all .15s var(--ease);
          box-shadow:var(--shadow-sm);
        }
        .search-wrap input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft);}
        .search-wrap input::placeholder{color:var(--text3);}

        /* ===== Content ===== */
        .view{padding:18px 14px 16px;}
        .section-title{font-size:11.5px;color:var(--text3);font-weight:800;margin:14px 4px 10px;display:flex;align-items:center;justify-content:space-between;letter-spacing:.3px;text-transform:uppercase;}
        .pill{
          font-size:10.5px;padding:4px 11px;border-radius:var(--radius-full);
          background:var(--gold-soft);color:var(--gold2);font-weight:800;
        }

        /* ===== Worker card ===== */
        .worker-card{
          position:relative;background:var(--surface);border-radius:var(--radius);
          box-shadow:var(--shadow-md);margin-bottom:12px;overflow:hidden;
          border:1px solid var(--border);
          display:flex;
          backdrop-filter:blur(12px);
          -webkit-backdrop-filter:blur(12px);
          transition:all .2s var(--ease);
        }
        .worker-card:active{transform:scale(.98);box-shadow:var(--shadow-sm);border-color:var(--gold-soft);}
        .worker-card .stub{width:4px;flex-shrink:0;background:var(--border);}
        .worker-card.paid .stub{background:linear-gradient(180deg,var(--green2),var(--green));}
        .worker-card.due .stub{background:linear-gradient(180deg,var(--gold2),var(--gold));}
        .worker-card.empty .stub{background:var(--border);}
        .worker-card .body{flex:1;padding:14px 15px 13px;min-width:0;}
        .worker-card .row1{display:flex;align-items:center;justify-content:space-between;gap:10px;}
        .wc-lead{display:flex;align-items:center;gap:11px;min-width:0;}
        .wc-avatar{
          width:42px;height:42px;border-radius:50%;flex-shrink:0;color:#fff;font-weight:800;font-size:15px;
          display:flex;align-items:center;justify-content:center;
          box-shadow:0 4px 12px rgba(0,0,0,.4), inset 0 0 0 2px rgba(255,255,255,.15);
        }
        .worker-card .name{font-size:15px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .worker-card .rate{font-size:11px;color:var(--text3);margin-top:2px;font-weight:600;}
        .stamp{
          flex-shrink:0;padding:5px 12px;border-radius:var(--radius-full);
          font-size:10px;font-weight:800;letter-spacing:.1px;white-space:nowrap;
        }
        .stamp.paid{color:var(--green2);background:var(--green-soft);border:1px solid rgba(16,185,129,.25);}
        .stamp.due{color:var(--gold2);background:var(--gold-soft);border:1px solid rgba(212,175,55,.25);}
        .stamp.empty{color:var(--text3);background:var(--surface2);border:1px solid var(--border);}
        .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:13px;border-top:1px solid var(--border2);padding-top:11px;}
        .stat-box{text-align:center;padding:0 4px;position:relative;}
        .stat-box + .stat-box{border-inline-start:1px solid var(--border2);}
        .stat-box .v{font-size:14px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;}
        .stat-box .l{font-size:9px;color:var(--text3);margin-top:3px;font-weight:700;letter-spacing:.1px;}
        .net-line{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:11px;border-top:1px solid var(--border2);}
        .net-line .l{font-size:11.5px;color:var(--text2);font-weight:600;}
        .net-line .v{font-size:19px;font-weight:800;}
        .v.pos{color:var(--green2);}
        .v.neg{color:var(--red2);}

        /* ===== Buttons ===== */
        .btn{
          display:flex;align-items:center;justify-content:center;gap:7px;
          padding:13px 15px;border-radius:var(--radius);font-weight:800;font-size:14px;
          transition:all .15s var(--ease);
          letter-spacing:.1px;
          position:relative;
          box-shadow:var(--shadow-sm);
        }
        .btn svg{flex-shrink:0;}
        .btn:active{transform:scale(.95);box-shadow:none;}
        .btn-primary{background:linear-gradient(135deg, var(--bg3), var(--bg2));color:var(--text);box-shadow:var(--shadow-md);border:1px solid var(--border);}
        .btn-gold{background:linear-gradient(135deg, var(--gold2), var(--gold) 55%, var(--gold3));color:#1A1205;box-shadow:var(--shadow-gold);}
        .btn-green{background:linear-gradient(135deg, var(--green2), var(--green) 80%);color:#fff;box-shadow:var(--shadow-green);}
        .btn-red{background:linear-gradient(135deg, var(--red2), var(--red) 80%);color:#fff;box-shadow:var(--shadow-red);}
        .btn-accent{background:linear-gradient(135deg, var(--accent2), var(--accent) 80%);color:#fff;box-shadow:var(--shadow-accent);}
        .btn-outline{background:var(--surface);border:1.5px solid var(--border);color:var(--text);box-shadow:none;}
        .btn-outline:active{background:var(--surface2);}
        .btn-soft{background:var(--surface2);color:var(--text);box-shadow:none;}
        .btn-soft:active{background:rgba(30,41,63,.8);}
        .btn-block{width:100%;}
        .btn-sm{padding:9px 11px;font-size:12.5px;border-radius:10px;}
        .btn-row{display:flex;gap:9px;}
        .btn[disabled]{opacity:.4;pointer-events:none;box-shadow:none;}

        /* ===== Bottom action bar ===== */
        .bottombar{
          position:fixed;bottom:0;left:50%;transform:translateX(-50%);
          width:calc(100% - 20px);max-width:540px;
          bottom:12px;
          padding:12px;
          background:rgba(15,22,37,.88);
          backdrop-filter:blur(20px);
          -webkit-backdrop-filter:blur(20px);
          border:1px solid var(--border);
          border-radius:var(--radius-lg);
          display:flex;gap:9px;z-index:15;
          box-shadow:var(--shadow-xl);
          transition:all .3s var(--ease);
        }
        body.light-mode .bottombar{
          background:rgba(255,255,255,.92);
          box-shadow:0 -4px 20px rgba(15,23,42,.08);
        }
        @media (max-width:400px){
          .bottombar{width:calc(100% - 12px);bottom:6px;padding:10px;}
          .bottombar .btn{font-size:12px;padding:11px 8px;}
        }

        /* ===== Modal / sheet ===== */
        .overlay{position:fixed;inset:0;background:rgba(5,8,15,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
        .sheet{
          width:100%;max-width:560px;background:var(--bg2);border-radius:var(--radius-xl) var(--radius-xl) 0 0;
          max-height:92vh;overflow-y:auto;padding:6px 18px 26px;animation:slideUp .3s var(--ease-spring);
          box-shadow:0 -16px 48px rgba(0,0,0,.5);
          border-top:1px solid var(--border);
          transition:background .3s var(--ease);
        }
        @keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
        .sheet-handle{width:40px;height:5px;background:var(--border);border-radius:3px;margin:10px auto 16px;}
        .sheet h2{font-size:19px;margin-bottom:4px;font-weight:900;color:var(--text);}
        .sheet .desc{font-size:12.5px;color:var(--text2);margin-bottom:16px;line-height:1.65;}
        .field{margin-bottom:15px;}
        .field label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:700;}
        .field input,.field select,.field textarea{
          width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);
          background:var(--surface);font-size:15px;color:var(--text);
          transition:all .15s var(--ease);
        }
        .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft);}
        .field input::placeholder,.field textarea::placeholder{color:var(--text3);}
        .seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px;}
        .seg button{flex:1;padding:10px;border-radius:10px;font-size:13px;font-weight:700;color:var(--text2);transition:all .15s var(--ease);}
        .seg button.active{background:var(--bg3);color:var(--gold2);box-shadow:var(--shadow-sm);border:1px solid var(--gold-soft);}
        .seg.small button{padding:8px;font-size:12px;}

        /* list rows */
        .entry-row{
          display:flex;align-items:center;justify-content:space-between;gap:10px;
          background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px;
          box-shadow:var(--shadow-sm);
          backdrop-filter:blur(8px);
          -webkit-backdrop-filter:blur(8px);
          transition:all .15s var(--ease);
        }
        .entry-row:active{background:var(--surface2);}
        .entry-row .info .t{font-size:13.5px;font-weight:700;color:var(--text);}
        .entry-row .info .t .tag{margin-inline-start:6px;vertical-align:middle;}
        .entry-row .info .s{font-size:11px;color:var(--text3);margin-top:2px;}
        .entry-row .amt{font-size:15px;font-weight:800;color:var(--text);}
        .entry-row .acts{display:flex;gap:5px;}
        .mini-btn{width:32px;height:32px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .15s var(--ease);border:1px solid var(--border);}
        .mini-btn:active{transform:scale(.85);background:rgba(30,41,63,.8);}
        .mini-btn.danger{color:var(--red2);}
        .mini-btn.danger:active{background:var(--red-soft);}
        .tag{font-size:9.5px;padding:3px 8px;border-radius:7px;font-weight:800;}
        .tag.normal{background:var(--gold-soft);color:var(--gold2);}
        .tag.advance{background:var(--blue-soft);color:var(--blue2);}
        .tag.full{background:var(--green-soft);color:var(--green2);}
        .tag.partial{background:var(--gold-soft);color:var(--gold2);}

        /* ===== Chart ===== */
        .chart-container{
          background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
          padding:20px;margin-bottom:12px;box-shadow:var(--shadow-sm);
          backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
        }
        .chart-title{font-size:14px;font-weight:800;color:var(--text);margin-bottom:15px;text-align:center;}
        .chart-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
        .chart-bar-label{font-size:11px;color:var(--text2);font-weight:700;min-width:60px;}
        .chart-bar-track{flex:1;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;}
        .chart-bar-fill{height:100%;border-radius:4px;transition:width .6s var(--ease);}

        /* table */
        .table-wrap{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch;box-shadow:var(--shadow-sm);}
        table{width:100%;min-width:600px;border-collapse:collapse;font-size:12px;}
        th,td{padding:11px 8px;text-align:center;border-bottom:1px solid var(--border2);white-space:nowrap;color:var(--text);}
        th{background:linear-gradient(160deg, var(--bg3), var(--bg2));color:var(--gold2);font-size:10.5px;font-weight:700;letter-spacing:.2px;}
        td:first-child,th:first-child{text-align:center;padding-right:8px;font-weight:700;}
        tfoot td{font-weight:800;background:var(--gold-soft);color:var(--gold2);border-bottom:none;font-size:13px;}
        tbody tr{transition:background .12s;}
        tbody tr:active{background:var(--surface2);}
        tbody tr:last-child td{border-bottom:none;}

        /* empty state */
        .empty-state{text-align:center;padding:40px 20px;color:var(--text2);}
        .empty-state .ic{
          width:70px;height:70px;border-radius:24px;margin:0 auto 16px;
          background:linear-gradient(155deg, var(--bg3), var(--bg2));
          display:flex;align-items:center;justify-content:center;color:var(--gold2);
          box-shadow:var(--shadow-md), inset 0 0 0 1px rgba(212,175,55,.1);
        }
        .empty-state .ic svg{width:28px;height:28px;}
        .empty-state .t{font-size:17px;font-weight:900;color:var(--text);margin-bottom:8px;}
        .empty-state .s{font-size:13px;line-height:1.7;color:var(--text3);margin-bottom:24px;max-width:260px;margin-inline:auto;}
        .empty-state .btn{max-width:200px;margin:0 auto;}

        /* jard list rows */
        .jrow{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:14px 16px;margin-bottom:9px;box-shadow:var(--shadow-sm);transition:all .15s var(--ease);}
        .jrow:active{background:var(--surface2);transform:scale(.98);}
        .jrow .name{font-size:14.5px;font-weight:800;color:var(--text);}
        .jrow .status{font-size:10px;font-weight:800;padding:5px 12px;border-radius:var(--radius-full);}
        .jrow .status.done{background:var(--green-soft);color:var(--green2);}
        .jrow .status.pending{background:var(--surface2);color:var(--text3);}

        /* step header for jard entry */
        .step-head{text-align:center;margin-bottom:22px;}
        .step-head .who{font-size:22px;font-weight:800;color:var(--text);}
        .step-head .prompt{font-size:13px;color:var(--text3);margin-top:4px;}
        .big-input{width:100%;padding:18px;font-size:28px;font-weight:800;text-align:center;border-radius:16px;border:2px solid var(--border);background:var(--surface);color:var(--text);transition:all .15s var(--ease);}
        .big-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 5px var(--gold-soft);}
        .big-input::placeholder{color:var(--text3);}

        /* lock screen */
        .lock-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:transparent;color:#fff;padding:30px;text-align:center;}
        .lock-wrap img.lock-logo{
          width:100px;height:100px;border-radius:50%;margin-bottom:24px;
          box-shadow:0 0 40px rgba(212,175,55,0.2), 0 0 0 4px rgba(255,255,255,0.05);
          animation: floatLogo 4s ease-in-out infinite;
          object-fit: contain;
          background-color: #fff;
          padding: 5px;
        }
        @keyframes floatLogo {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-10px); }
        }
        .lock-wrap h1{font-size:24px;color:var(--text);margin-bottom:8px;font-weight:900;letter-spacing:.5px; text-shadow: 0 2px 10px rgba(0,0,0,0.3);}
        .lock-wrap .s{font-size:13px;color:var(--text2);margin-bottom:32px; font-weight: 500;}
        .dots{display:flex;gap:16px;margin-bottom:32px;}
        .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);transition:all .2s var(--ease); background: rgba(255,255,255,0.05);}
        .dot.filled{background:var(--gold2);border-color:var(--gold2);transform:scale(1.25);box-shadow:0 0 20px rgba(212,175,55,.8);}

        .keypad{display:grid;grid-template-columns:repeat(3,72px);gap:16px;}
        .keypad button{
          width:72px;height:72px;border-radius:24px;
          background:rgba(255,255,255,0.03);
          backdrop-filter: blur(10px);
          -webkit-backdrop-filter: blur(10px);
          border:1px solid rgba(255,255,255,0.1);
          color:var(--text);font-size:22px;font-weight:700;
          transition:all .2s var(--ease);
          box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .keypad button:active{background:var(--gold-soft);transform:scale(.92);border-color:var(--gold); color: var(--gold2);}
        .lock-err{color:var(--red2);font-size:13px;height:18px;margin-bottom:12px;font-weight:700; animation: shake 0.4s ease-in-out;}
        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          25% { transform: translateX(-5px); }
          75% { transform: translateX(5px); }
        }

        /* stats */
        .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:11px;box-shadow:var(--shadow-sm);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:all .15s var(--ease);}
        .stat-card:active{background:var(--surface2);}
        .stat-card .big{font-size:25px;font-weight:800;color:var(--text);}
        .stat-card .lbl{font-size:11.5px;color:var(--text3);margin-top:3px;font-weight:600;}
        .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

        /* toast */
        #toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--bg3);color:var(--text);padding:11px 22px;border-radius:var(--radius-full);font-size:13px;font-weight:700;z-index:99;box-shadow:var(--shadow-xl);border:1px solid var(--border);opacity:0;pointer-events:none;transition:all .25s var(--ease);}
        #toast.show{opacity:1;bottom:116px;}

        /* menu sheet items */
        .menu-item{display:flex;align-items:center;gap:13px;padding:15px 4px;border-bottom:1px solid var(--border2);font-size:14px;font-weight:700;color:var(--text);transition:all .12s var(--ease);}
        .menu-item:active{background:var(--surface2);}
        .menu-item:last-child{border-bottom:none;}
        .menu-item .ic{width:38px;height:38px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--text2);flex-shrink:0;border:1px solid var(--border);}
        .menu-item .ic svg{width:17px;height:17px;}
        .menu-item .ic-slate{background:var(--surface2);color:var(--text2);}
        .menu-item .ic-gold{background:var(--gold-soft);color:var(--gold2);}
        .menu-item .ic-rust{background:var(--red-soft);color:var(--red2);}
        .menu-item .ic-blue{background:var(--blue-soft);color:var(--blue2);}
        .menu-item .ic-green{background:var(--green-soft);color:var(--green2);}

        .section-title{font-size:12px;font-weight:800;color:var(--text3);margin:15px 4px 10px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.5px;}
        .section-title::after{content:'';flex:1;height:1px;background:var(--border2);opacity:.5;}

        /* quick access grid (home) */
        .quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:18px;}
        .quick-item{
          display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
          background:var(--surface);border:1px solid var(--border);border-radius:16px;
          padding:14px 4px 12px;box-shadow:var(--shadow-sm);
          backdrop-filter:blur(8px);
          -webkit-backdrop-filter:blur(8px);
          transition:all .15s var(--ease-spring);
        }
        .quick-item:active{background:var(--surface2);transform:scale(.93);border-color:var(--gold-soft);}
        .quick-item .qic{
          width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;
        }
        .quick-item .qic svg{width:19px;height:19px;}
        .quick-item .qlbl{font-size:10px;font-weight:700;color:var(--text);text-align:center;line-height:1.3;}
        .quick-item .qic.c1{background:var(--gold-soft);color:var(--gold2);}
        .quick-item .qic.c2{background:var(--green-soft);color:var(--green2);}
        .quick-item .qic.c3{background:var(--blue-soft);color:var(--blue2);}
        .quick-item .qic.c4{background:var(--surface2);color:var(--text2);}

        /* daily attendance (تحضير يومي) */
        .att-cta{
          display:flex;align-items:center;gap:13px;background:
            linear-gradient(135deg, rgba(212,175,55,.18) 0%, rgba(139,92,246,.18) 100%);
          border-radius:var(--radius-lg);padding:16px;margin-bottom:16px;color:var(--text);
          border:1px solid rgba(212,175,55,.25);
          box-shadow:var(--shadow-gold);
          transition:all .15s var(--ease);
        }
        .att-cta:active{transform:scale(.97);box-shadow:none;}
        .att-cta-ic{width:44px;height:44px;border-radius:14px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;color:var(--gold2);flex-shrink:0;}
        .att-cta-body{flex:1;min-width:0;}
        .att-cta-title{font-size:14.5px;font-weight:800;color:var(--text);}
        .att-cta-sub{font-size:11.5px;color:var(--text2);margin-top:2px;font-weight:600;}
        .att-cta-arrow{color:var(--text3);flex-shrink:0;}

        .att-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
        .att-date{font-size:14.5px;font-weight:800;color:var(--text);}
        .icon-btn.dark{background:var(--surface);border:1px solid var(--border);color:var(--text);box-shadow:var(--shadow-sm);}
        .icon-btn.dark:active{background:var(--surface2);}
        .icon-btn.dark[disabled]{opacity:.35;pointer-events:none;}
        .att-summary{text-align:center;font-size:12px;color:var(--text2);font-weight:700;margin-bottom:14px;}

        .att-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 15px;margin-bottom:10px;box-shadow:var(--shadow-sm);transition:all .15s var(--ease);}
        .att-row:active{background:var(--surface2);}
        .att-name{font-size:15.5px;font-weight:800;color:var(--text);}
        .att-actions{display:flex;align-items:center;gap:8px;}
        .att-toggle{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:3px;}
        .att-btn{width:32px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:all .15s var(--ease);}
        .att-btn:active{transform:scale(.88);}
        .att-btn.absent.active{background:var(--red);color:#fff;}
        .att-btn.present.active{background:var(--green);color:#fff;}
        .moto-chip{width:30px;height:30px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s var(--ease);flex-shrink:0;border:1px solid var(--border);}
        .moto-chip.active{background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold);}
        .moto-chip:active{transform:scale(.88);}

        /* developer signature card */
        .sig-card{
          margin-top:20px;background:linear-gradient(165deg, var(--bg3) 0%, var(--bg2) 100%);
          border-radius:var(--radius-lg);padding:24px 20px 20px;text-align:center;color:var(--text);
          box-shadow:var(--shadow-lg);position:relative;overflow:hidden;
          border:1px solid var(--border);
        }
        .sig-card::before{
          content:"";position:absolute;inset:0;
          background:radial-gradient(circle at 85% -10%, rgba(212,175,55,.2), transparent 55%);
          pointer-events:none;
        }
        .sig-logo{width:44px;height:44px;border-radius:50%;margin-bottom:12px;box-shadow:0 8px 20px rgba(0,0,0,.4);position:relative; object-fit: cover; background: #fff;}
        .sig-name{font-size:15px;font-weight:800;position:relative;color:var(--text);}
        .sig-role{font-size:11px;color:var(--text3);margin-top:3px;font-weight:600;position:relative;}
        .sig-row{display:flex;gap:8px;justify-content:center;margin-top:16px;position:relative;}
        .sig-btn{
          display:flex;align-items:center;gap:6px;padding:10px 18px;border-radius:var(--radius-full);
          font-size:12px;font-weight:800;color:#fff;transition:all .12s var(--ease);
        }
        .sig-btn:active{transform:scale(.93);}
        .sig-btn.call{background:linear-gradient(135deg,var(--gold2),var(--gold3));color:#1A1205;}
        .sig-btn.wa{background:linear-gradient(135deg,#34D399,#059669);}
        .sig-num{font-size:10.5px;color:var(--text3);margin-top:12px;font-weight:600;letter-spacing:.3px;position:relative;}

        /* printable report (offscreen) */
        #print-capture{position:fixed;top:-9999px;left:-9999px;width:520px;background:#fff;padding:28px;font-family:'Tajawal',sans-serif;direction:rtl;}
        .rep-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #0F172A;padding-bottom:12px;margin-bottom:16px;}
        .rep-head h2{font-size:24px;color:#0F172A;}
        .rep-head .d{font-size:11px;color:#666;}
        .rep-tbl{width:100%;border-collapse:collapse;font-size:13px;}
        .rep-tbl th,.rep-tbl td{border:1px solid #ccc;padding:7px;text-align:center;color:#0F172A;}
        .rep-tbl th{background:#0F172A;color:#fff;}
        .rep-foot{margin-top:14px;font-size:13px;color:#0F172A;}
        .rep-foot .line{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #ddd;}
        .rep-foot .line.total{font-weight:900;font-size:16px;border-bottom:none;border-top:2px solid #0F172A;padding-top:8px;margin-top:4px;}
    </style>
</head>

      list = list||[];
      const deductions = list.filter(x=>x.type!=='advance').reduce((s,x)=>s+Number(x.amount||0),0);
      const advance = list.filter(x=>x.type==='advance').reduce((s,x)=>s+Number(x.amount||0),0);
      return { deductions, advance };
    }
    function fmt(n){
      n = Math.round((n||0) * 100) / 100;
      return n.toLocaleString('en-US', {maximumFractionDigits:2});
    }
    function todayStr(){
      const d = new Date();
      return d.toLocaleDateString('ar-EG', {year:'numeric', month:'long', day:'numeric'});
    }
    function nowISO(){ return new Date().toISOString(); }
    function esc(s){
      return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function initials(name){
      const parts = String(name||'').trim().split(/\s+/).filter(Boolean);
      if(parts.length===0) return '؟';
      return parts[0].slice(0,1);
    }
    const AVATAR_PALETTE = [
      ['#0F1E29','#22394B'], ['#B8862E','#DDAE5C'], ['#1E8A5F','#2BAA78'],
      ['#2A64C7','#5387E0'], ['#8B4A9C','#B26FC4'], ['#C0432E','#D9614A']
    ];
    function avatarGradient(id){
      let h=0; for(let i=0;i<id.length;i++){ h = (h*31 + id.charCodeAt(i)) >>> 0; }
      const [c1,c2] = AVATAR_PALETTE[h % AVATAR_PALETTE.length];
      return `linear-gradient(145deg, ${c2}, ${c1})`;
    }
    function toast(msg){
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._timer);
      t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
    }
    function toggleDarkMode(){
      darkMode = !darkMode;
      document.body.classList.toggle('light-mode', !darkMode);
      localStorage.setItem('ledger-dark-mode', darkMode ? 'dark' : 'light');
      applyBgLayer();
      render();
    }
    function applyBgLayer(){
      const layer = document.getElementById('bg-layer');
      if(!layer) return;
      const overlay = darkMode
        ? 'linear-gradient(rgba(6,9,15,.87),rgba(6,9,15,.91))'
        : 'linear-gradient(rgba(248,250,252,.82),rgba(248,250,252,.86))';
      layer.style.backgroundImage = `${overlay}, url(data:image/jpeg;base64,${LOGO_BG_B64})`;
    }

    /* ---------- default state ---------- */
    function defaultState(){
      return {
        settings: { pin: null, pinEnabled:false, currency:"ر.س" },
        workers: [],
        cycle: { startDate: nowISO(), entries: {}, attendance: {} },
        archive: []
      };
    }

    /* ---------- persistence ---------- */
    async function loadState(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        if(raw){
          state = JSON.parse(raw);
          if(!state.settings) state.settings = { pin:null, pinEnabled:false, currency:"ر.س" };
          if(state.settings.currency==null) state.settings.currency = "ر.س";
          if(!state.cycle) state.cycle = { startDate: nowISO(), entries:{}, attendance:{} };
          if(!state.cycle.attendance) state.cycle.attendance = {};
          if(!state.archive) state.archive = [];
          if(!state.workers) state.workers = [];
        } else {
          state = defaultState();
        }
      }catch(e){
        state = defaultState();
      }
      const savedMode = localStorage.getItem('ledger-dark-mode');
      if(savedMode === 'light'){
        darkMode = false;
        document.body.classList.add('light-mode');
      }
      applyBgLayer();
    }
    function persist(){
      clearTimeout(saveTimer);
      saveTimer = setTimeout(()=>{
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
        catch(e){ toast("تعذر حفظ البيانات على الجهاز"); }
      }, 150);
    }

    /* ---------- computed helpers ---------- */
    function activeWorkers(){
      if(!state || !state.workers) return [];
      return state.workers.filter(w=>!w.archived);
    }
    function getEntry(workerId){
      if(!state.cycle.entries[workerId]){
        state.cycle.entries[workerId] = { days:null, withdrawals:[], payments:[], done:false, motoDays:null };
      }
      const e = state.cycle.entries[workerId];
      if(e.motoDays===undefined) e.motoDays = null;
      return e;
    }
    function calcWorker(workerId){
      const w = state.workers.find(x=>x.id===workerId);
      return calcWorkerData(w, state.cycle.entries[workerId]);
    }
    function calcWorkerData(w, entry){
      const e = entry || { days:null, withdrawals:[], payments:[], motoDays:null };
      const days = e.days || 0;
      const gross = days * (w? w.dailyRate:0);
      const motoDays = e.motoDays || 0;
      const motoRate = (w && w.hasMoto) ? Number(w.motoRate||0) : 0;
      const motoTotal = motoDays * motoRate;
      const earnings = gross + motoTotal;
      const list = e.withdrawals||[];
      const { deductions: totalWithdrawals, advance: totalAdvance } = splitWithdrawals(list);
      const net = earnings - totalWithdrawals;
      const totalDue = net + totalAdvance;
      const totalPaid = (e.payments||[]).reduce((s,x)=>s+Number(x.amount||0),0);
      const remaining = totalDue - totalPaid;
      const hasData = e.days!=null || e.motoDays!=null || (list.length>0) || (e.payments&&e.payments.length);
      return { days, gross, motoDays, motoRate, motoTotal, earnings, totalWithdrawals, totalAdvance, net, totalDue, totalPaid, remaining, hasData };
    }
    function cur(){ return state.settings.currency || "ر.س"; }

    /* ---------- daily attendance (تحضير يومي) ---------- */
    function pad2(n){ return String(n).padStart(2,'0'); }
    function dateKeyOf(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
    function todayKey(){ return dateKeyOf(new Date()); }
    function getAttendanceDay(dateKey){
      if(!state.cycle.attendance) state.cycle.attendance = {};
      if(!state.cycle.attendance[dateKey]) state.cycle.attendance[dateKey] = {};
      return state.cycle.attendance[dateKey];
    }
    function workerHasAttendance(workerId){
      const att = state.cycle.attendance || {};
      return Object.keys(att).some(k => att[k] && att[k][workerId]);
    }
    function recomputeFromAttendance(workerId){
      const att = state.cycle.attendance || {};
      let used=false, presentCount=0, motoCount=0;
      Object.keys(att).forEach(dateKey=>{
        const rec = att[dateKey][workerId];
        if(rec){
          used = true;
          if(rec.present) presentCount++;
          if(rec.moto) motoCount++;
        }
      });
      if(used){
        const e = getEntry(workerId);
        e.days = presentCount;
        const w = state.workers.find(x=>x.id===workerId);
        if(w && w.hasMoto) e.motoDays = motoCount;
      }
    }
    function setAttendance(workerId, dateKey, present){
      const day = getAttendanceDay(dateKey);
      if(!day[workerId]) day[workerId] = {};
      day[workerId].present = present;
      if(!present) day[workerId].moto = false;
      recomputeFromAttendance(workerId);
      persist();
      go('attendance', {date:dateKey});
    }
    function toggleAttMoto(workerId, dateKey){
      const day = getAttendanceDay(dateKey);
      if(!day[workerId]) day[workerId] = {present:true};
      day[workerId].moto = !day[workerId].moto;
      recomputeFromAttendance(workerId);
      persist();
      go('attendance', {date:dateKey});
    }
    function markAllPresent(dateKey){
      const day = getAttendanceDay(dateKey);
      activeWorkers().forEach(w=>{
        if(!day[w.id]) day[w.id] = {};
        day[w.id].present = true;
      });
      activeWorkers().forEach(w=>recomputeFromAttendance(w.id));
      persist();
      toast('تم تحديد الجميع حاضرين');
      go('attendance', {date:dateKey});
    }
    function attNavDay(dateKey, delta){
      const d = new Date(dateKey+'T00:00:00');
      d.setDate(d.getDate()+delta);
      const newKey = dateKeyOf(d);
      if(newKey > todayKey()) return;
      go('attendance', {date:newKey});
    }
    function formatDateHuman(dateKey){
      const d = new Date(dateKey+'T00:00:00');
      const label = d.toLocaleDateString('ar-EG',{weekday:'long', day:'numeric', month:'long'});
      return dateKey===todayKey() ? 'اليوم — '+label : label;
    }
    function attendanceTodaySummary(){
      const list = activeWorkers();
      if(list.length===0) return null;
      const day = (state.cycle.attendance && state.cycle.attendance[todayKey()]) || {};
      const marked = list.filter(w=>day[w.id]).length;
      const present = list.filter(w=>day[w.id]&&day[w.id].present).length;
      return { total:list.length, marked, present };
    }

    /* ============================================================
       RENDER ROOT
       ============================================================ */
    function go(route, params){
      view = { route, params: params||{} };
      render();
      window.scrollTo(0,0);
    }
    function render(){
      const root = document.getElementById('app-root');
      let html = '';
      html += renderTopbar();
      html += '<div class="view" id="view-inner">';
      switch(view.route){
        case 'home': html += renderHome(); break;
        case 'attendance': html += renderAttendance(); break;
        case 'workerDetail': html += renderWorkerDetail(view.params.id); break;
        case 'jardList': html += renderJardList(); break;
        case 'jardEntry': html += renderJardEntry(view.params.id); break;
        case 'table': html += renderTable(); break;
        case 'payments': html += renderPaymentsLog(); break;
        case 'archivedWorkers': html += renderArchivedWorkers(); break;
        case 'cyclesArchive': html += renderCyclesArchive(); break;
        case 'cycleDetail': html += renderCycleDetail(view.params.id); break;
        case 'stats': html += renderStats(); break;
        case 'settings': html += renderSettings(); break;
        default: html += renderHome();
      }
      html += '</div>';
      html += renderBottomBar();
      root.innerHTML = html;
      afterRender();
    }

    function renderTopbar(){
      const titles = {
        home:['دفتر الحساب', `${activeWorkers().length} عامل نشط`],
        attendance:['التحضير اليومي',''],
        workerDetail:['كشف حساب العامل',''],
        jardList:['الجرد', 'اختر عامل لتسجيل بياناته'],
        jardEntry:['تسجيل الجرد',''],
        table:['الجدول الإجمالي', todayStr()],
        payments:['كشف الدفعات', 'جميع المبالغ المصروفة'],
        archivedWorkers:['العمال المؤرشفون',''],
        cyclesArchive:['أرشيف الدورات السابقة',''],
        cycleDetail:['تفاصيل الدورة',''],
        stats:['الإحصائيات', todayStr()],
        settings:['الإعدادات','']
      };
      const t = titles[view.route] || ['دفتر الحساب',''];
      const showBack = view.route !== 'home';
      let search = '';
      if(view.route==='home'){
        search = `<div class="search-wrap"><span class="search-ic">${ICONS.search}</span><input id="searchBox" placeholder="بحث عن عامل..." oninput="onSearch(this.value)" value="${esc(view.params.q||'')}"></div>`;
      }
      return `
      <div class="topbar">
        <div class="topbar-row">
          <div style="display:flex;align-items:center;gap:10px;">
            ${showBack? `<button class="icon-btn" onclick="goBack()">→</button>` : `<img src="data:image/png;base64,${LOGO_B64}" alt="" style="width:34px;height:34px;border-radius:10px;flex-shrink:0;">`}
            <div><h1>${t[0]}</h1>${t[1]?`<div class="sub">${t[1]}</div>`:''}</div>
          </div>
          <div class="topbar-actions">
            ${view.route==='home'? `<button class="icon-btn" onclick="toggleDarkMode()">${darkMode?ICONS.sun:ICONS.moon}</button><button class="icon-btn" onclick="go('settings')">${ICONS.gear}</button>`:''}
          </div>
        </div>
        ${search}
      </div>`;
    }

    function renderBottomBar(){
      if(view.route==='home'){
        return `<div class="bottombar">
          <button class="btn btn-outline btn-block" onclick="openAddWorker()">${ICONS.plus} إضافة عامل</button>
          <button class="btn btn-gold btn-block" onclick="go('jardList')">${ICONS.clipboard} بدء الجرد</button>
          <button class="btn btn-green btn-block" onclick="go('table')">${ICONS.cash} الدفع</button>
        </div>`;
      }
      if(view.route==='jardList'){
        return `<div class="bottombar"><button class="btn btn-primary btn-block" onclick="go('table')">عرض الجدول الإجمالي ←</button></div>`;

      if(view.route==='attendance'){
        return `<div class="bottombar"><button class="btn btn-primary btn-block" onclick="go('home')">${ICONS.check} تم</button></div>`;

          <button class="btn btn-green btn-block" style="font-size:12.5px;padding:11px 4px;" onclick="confirmPayAll()">${ICONS.checkCircle} دفع الكل</button>

    function goBack(){
      const map = {
        workerDetail:'home', jardList:'home', jardEntry:'jardList', table:'home',
        payments:'home', archivedWorkers:'settings', cyclesArchive:'settings',
        cycleDetail:'cyclesArchive', stats:'home', settings:'home'
      };
      go(map[view.route]||'home');
    }

    /* ============================================================
       HOME
       ============================================================ */
    function onSearch(q){
      view.params.q = q;
      const cards = document.getElementById('cardsList');
      if(cards) cards.outerHTML = cardsListHTML(q);
    }
    function cardsListHTML(q){
      q = (q||'').trim();
      let list = activeWorkers();
      if(q) list = list.filter(w=>w.name.includes(q));
      if(list.length===0){
        return `<div id="cardsList">
          ${emptyState(
            ICONS.users,
            q ? 'لا توجد نتائج' : 'ابدأ بإضافة أول عامل',
            q ? 'لم نعثر على أي اسم يطابق بحثك حالياً.' : 'سجل عمالك الآن لتبدأ في إدارة حضورهم وحساباتهم بكل سهولة.',
            q ? null : `<button class="btn btn-gold btn-sm" onclick="openAddWorker()">${ICONS.plus} إضافة عامل الآن</button>`
          )}
        </div>`;
      }
      let h = `<div id="cardsList">`;
      list.slice().sort((a,b)=>a.name.localeCompare(b.name,'ar')).forEach(w=>{
        const c = calcWorkerData(w, state.cycle.entries[w.id]);
        let stampClass='empty', stampText='لم يُدخل';
        if(c.hasData){
          if(c.remaining<=0){ stampClass='paid'; stampText='مسدد بالكامل'; }
          else { stampClass='due'; stampText='متبقي له'; }
        }
        h += `
        <div class="worker-card ${stampClass}" onclick="go('workerDetail',{id:'${w.id}'})">
          <div class="stub"></div>
          <div class="body">
            <div class="row1">
              <div class="wc-lead">
                <div class="wc-avatar" style="background:${avatarGradient(w.id)}">${esc(initials(w.name))}</div>
                <div>
                  <div class="name">${esc(w.name)}</div>
                  <div class="rate">${fmt(w.dailyRate)} ${cur()} / يوم${w.hasMoto?` &nbsp;🏍 ${fmt(w.motoRate)} ${cur()}/يوم`:''}</div>
                </div>
              </div>
              <div class="stamp ${stampClass}">${stampText}</div>
            </div>
            <div class="stat-grid">
              <div class="stat-box"><div class="v">${c.days||'—'}</div><div class="l">أيام</div></div>
              <div class="stat-box"><div class="v" style="color:var(--red)">${fmt(c.totalWithdrawals)}</div><div class="l">سحوبات</div></div>
              <div class="stat-box"><div class="v" style="color:var(--blue)">${fmt(c.totalAdvance)}</div><div class="l">مقدم</div></div>
              <div class="stat-box"><div class="v" style="color:var(--green)">${fmt(c.totalPaid)}</div><div class="l">مدفوع</div></div>
            </div>
            <div class="net-line">
              <div class="l">الصافي المتبقي</div>
              <div class="v ${c.remaining>0?'neg':'pos'}">${fmt(c.remaining)} ${cur()}</div>
            </div>
          </div>
        </div>`;
      });
      h += `</div>`;
      return h;
    }
    function emptyState(ic,t,s, actionHtml){
      return `
      <div class="empty-state">
        <div class="ic">${ic}</div>
        <div class="t">${t}</div>
        <div class="s">${s}</div>
        ${actionHtml || ''}
      </div>`;
    }

        ${attendanceCardHTML()}

        ${quickGridHTML()}

      `;
    }
    function attendanceCardHTML(){
      const sum = attendanceTodaySummary();
      if(!sum) return '';
      return `
      <div class="att-cta" onclick="go('attendance',{date:todayKey()})">
        <div class="att-cta-ic">${ICONS.calendarCheck}</div>

          <div class="att-cta-title">التحضير اليومي</div>
          <div class="att-cta-sub">${sum.marked===0? 'لم يُسجَّل تحضير اليوم بعد' : `${sum.present} من ${sum.total} حاضر اليوم`}</div>
        </div>
        <div class="att-cta-arrow">${ICONS.chevronL}</div>
      </div>`;
    }
    function quickGridHTML(){
      return `<div class="quick-grid">
        <div class="quick-item" onclick="go('table')"><div class="qic c1">${ICONS.chart}</div><div class="qlbl">الجدول الإجمالي</div></div>
        <div class="quick-item" onclick="go('payments')"><div class="qic c2">${ICONS.wallet}</div><div class="qlbl">الدفعات</div></div>
        <div class="quick-item" onclick="go('stats')"><div class="qic c3">${ICONS.trending}</div><div class="qlbl">الإحصائيات</div></div>
        <div class="quick-item" onclick="go('cyclesArchive')"><div class="qic c4">${ICONS.archive}</div><div class="qlbl">أرشيف الدورات</div></div>
      </div>`;

    function renderAttendance(){
      const dateKey = view.params.date || todayKey();
      const day = getAttendanceDay(dateKey);
      const list = activeWorkers();
      const presentCount = list.filter(w=>day[w.id]&&day[w.id].present).length;
      let h = `
      <div class="att-nav">
        <button class="icon-btn dark" onclick="attNavDay('${dateKey}',-1)">${ICONS.chevronR}</button>
        <div class="att-date">${formatDateHuman(dateKey)}</div>
        <button class="icon-btn dark" onclick="attNavDay('${dateKey}',1)" ${dateKey>=todayKey()?'disabled':''}>${ICONS.chevronL}</button>
      </div>
      <div class="att-summary">${presentCount} من ${list.length} حاضر</div>`;
      if(list.length===0){
        return h + emptyState(ICONS.users,'لا يوجد عمال بعد','أضف عمالًا أولًا من الصفحة الرئيسية');
      }
      h += `<button class="btn btn-outline btn-block" style="margin-bottom:14px;" onclick="markAllPresent('${dateKey}')">${ICONS.checkCircle} تحديد الجميع حاضرين</button>`;
      list.forEach(w=>{
        const rec = day[w.id] || {};
        const st = rec.present===true ? 'present' : (rec.present===false ? 'absent' : 'unmarked');
        h += `
        <div class="att-row">
          <div class="wc-lead">
            <div class="wc-avatar" style="width:44px;height:44px;font-size:16px;background:${avatarGradient(w.id)}">${esc(initials(w.name))}</div>
            <div class="att-name">${esc(w.name)}</div>
          </div>
          <div class="att-actions">
            ${w.hasMoto && st==='present' ? `<button class="moto-chip ${rec.moto?'active':''}" onclick="toggleAttMoto('${w.id}','${dateKey}')">🏍</button>` : ''}
            <div class="att-toggle">
              <button class="att-btn absent ${st==='absent'?'active':''}" onclick="setAttendance('${w.id}','${dateKey}',false)">${ICONS.close}</button>
              <button class="att-btn present ${st==='present'?'active':''}" onclick="setAttendance('${w.id}','${dateKey}',true)">${ICONS.check}</button>
            </div>
          </div>
        </div>`;
      });
      return h;
    }

    /* ============================================================
       ADD / EDIT WORKER
       ============================================================ */

        <div class="sheet-handle"></div>

        <div class="field"><label>اسم العامل</label><input id="wName" placeholder="مثال: محمد أحمد" value="${w?esc(w.name):''}"></div>
        <div class="field"><label>الأجر اليومي (${cur()})</label><input id="wRate" type="number" inputmode="decimal" placeholder="0" value="${w?w.dailyRate:''}"></div>
        <div class="field">
          <label>🏍 لديه المتور ؟</label>

            <button type="button" class="${(w&&w.hasMoto)?'active':''}" data-v="1" onclick="pickSeg('motoSeg',this); toggleMotoRateField();">نعم</button>
          </div>
        </div>
        <div class="field ${(w&&w.hasMoto)?'':'hidden'}" id="motoRateField">
          <label>حساب المتور اليومي (${cur()})</label>
          <input id="wMotoRate" type="number" inputmode="decimal" placeholder="0" value="${(w&&w.motoRate)?w.motoRate:''}">
        </div>
        <div class="btn-row" style="margin-top:6px;">
          ${w?`<button class="btn btn-red" onclick="archiveWorker('${w.id}')">أرشفة</button>`:''}

        </div>
      `);
    }
    function toggleMotoRateField(){
      const active = document.querySelector('#motoSeg button.active').dataset.v;
      document.getElementById('motoRateField').classList.toggle('hidden', active==='0');
    }
    function saveWorker(id){
      const name = document.getElementById('wName').value.trim();
      const rate = parseFloat(document.getElementById('wRate').value);
      if(!name){ toast('أدخل اسم العامل'); return; }
      if(isNaN(rate) || rate<0){ toast('أدخل أجرًا يوميًا صحيحًا'); return; }
      const hasMoto = document.querySelector('#motoSeg button.active').dataset.v==='1';
      let motoRate = 0;
      if(hasMoto){
        motoRate = parseFloat(document.getElementById('wMotoRate').value);
        if(isNaN(motoRate) || motoRate<0){ toast('أدخل حساب متور صحيح'); return; }
      }
      if(id){
        const w = state.workers.find(x=>x.id===id);
        w.name = name; w.dailyRate = rate; w.hasMoto = hasMoto; w.motoRate = motoRate;
      } else {
        state.workers.push({ id: uid(), name, dailyRate: rate, hasMoto, motoRate, archived:false, createdAt: nowISO() });
      }
      persist(); closeModal(); render();
      toast(id? 'تم تحديث بيانات العامل':'تمت إضافة العامل');
    }
    function archiveWorker(id){
      const w = state.workers.find(x=>x.id===id);
      if(!w) return;
      w.archived = true;
      persist(); closeModal(); go('home');
      toast('تم أرشفة العامل');
    }
    function restoreWorker(id){
      const w = state.workers.find(x=>x.id===id);
      if(!w) return;
      w.archived = false;
      persist(); render();
      toast('تمت استعادة العامل');
    }

      showModal(`
        <div class="sheet-handle"></div>
        <h2>🏍 أيام إحضار المتور</h2>
        <div class="desc">كم يومًا أحضر هذا العامل المتور  للعمل في هذه الفترة؟</div>
        <input id="motoDaysInput" type="number" inputmode="numeric" class="big-input" value="${e.motoDays!=null?e.motoDays:''}" placeholder="0">
        <button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="saveMotoDays('${id}')">حفظ</button>
      `);
