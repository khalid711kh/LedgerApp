    function addWithdrawalModal(id, wdId){
      const e = getEntry(id);
      const wd = wdId? e.withdrawals.find(x=>x.id===wdId) : null;
      const hasNote = !!(wd && wd.note);
      showModal(`
        <div class="sheet-handle"></div>
        <h2>${wd?'تعديل سحب':'إضافة سحب'}</h2>
        <div class="field">
          <label>النوع</label>
          <div class="seg small" id="typeSeg">
            <button type="button" class="${(!wd||wd.type==='normal')?'active':''}" data-v="normal" onclick="pickSeg('typeSeg',this)">سحب</button>
            <button type="button" class="${(wd&&wd.type==='advance')?'active':''}" data-v="advance" onclick="pickSeg('typeSeg',this)">مقدم</button>
          </div>
        </div>
        <div class="field"><label>المبلغ (${cur()})</label><input id="wdAmt" type="number" inputmode="decimal" enterkeyhint="done" class="big-input" style="font-size:24px;padding:12px;" value="${wd?wd.amount:''}" placeholder="0" onkeydown="if(event.key==='Enter'){event.preventDefault(); saveWithdrawal('${id}', ${wdId?`'${wdId}'`:'null'});}"></div>
        <div id="wdNoteWrap">
          ${hasNote
            ? `<div class="field"><label>ملاحظة (اختياري)</label><input id="wdNote" enterkeyhint="done" placeholder="مثال: سلفة شخصية" value="${esc(wd.note)}" onkeydown="if(event.key==='Enter'){event.preventDefault(); saveWithdrawal('${id}', ${wdId?`'${wdId}'`:'null'});}"></div>`
            : `<button type="button" class="btn btn-sm btn-soft" style="margin-bottom:13px;" onclick="showEditNoteField('${id}', ${wdId?`'${wdId}'`:'null'})">${ICONS.note} إضافة ملاحظة</button>`
          }
        </div>
        <button class="btn btn-primary btn-block" onclick="saveWithdrawal('${id}', ${wdId?`'${wdId}'`:'null'})">${wd?'حفظ التعديل':'إضافة'}</button>
      `);
    }
    function showEditNoteField(id, wdId){
      document.getElementById('wdNoteWrap').innerHTML = `<div class="field"><label>ملاحظة (اختياري)</label><input id="wdNote" enterkeyhint="done" placeholder="مثال: سلفة شخصية" onkeydown="if(event.key==='Enter'){event.preventDefault(); saveWithdrawal('${id}', ${wdId?`'${wdId}'`:'null'});}"></div>`;
      document.getElementById('wdNote').focus();
    }
    function pickSeg(segId, btn){
      document.querySelectorAll('#'+segId+' button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    }
    function saveWithdrawal(id, wdId){
      const amt = parseFloat(document.getElementById('wdAmt').value);
      if(isNaN(amt) || amt<=0){ toast('أدخل مبلغًا صحيحًا'); return; }
      const type = document.querySelector('#typeSeg button.active').dataset.v;
      const noteEl = document.getElementById('wdNote');
      const note = noteEl ? noteEl.value.trim() : '';
      const e = getEntry(id);
      if(wdId){
        const wd = e.withdrawals.find(x=>x.id===wdId);
        wd.amount = amt; wd.type = type; wd.note = note;
      } else {
        e.withdrawals.push({ id: uid(), amount: amt, type, note, createdAt: nowISO() });
      }
      persist(); closeModal(); render();
      toast('تم حفظ السحب');
    }
    function deleteWithdrawal(id, wdId){
      const e = getEntry(id);
      e.withdrawals = e.withdrawals.filter(x=>x.id!==wdId);
      persist(); render();
      toast('تم حذف السحب');
    }

    function openPaymentModal(id){
      const c = calcWorker(id);
      showModal(`
        <div class="sheet-handle"></div>
        <h2>تسجيل دفعة</h2>
        <div class="desc">المتبقي الحالي: <b>${fmt(c.remaining)} ${cur()}</b></div>
        <div class="field">
          <label>نوع الدفعة</label>
          <div class="seg" id="paySeg">
            <button type="button" class="active" data-v="full" onclick="pickSeg('paySeg',this); document.getElementById('payAmt').value=${c.remaining}; document.getElementById('payAmt').disabled=true;">دفع كامل المتبقي</button>
            <button type="button" data-v="partial" onclick="pickSeg('paySeg',this); document.getElementById('payAmt').disabled=false; document.getElementById('payAmt').value='';">دفعة جزئية</button>
          </div>
        </div>
        <div class="field"><label>المبلغ (${cur()})</label><input id="payAmt" type="number" inputmode="decimal" class="big-input" style="font-size:24px;padding:12px;" value="${c.remaining}" disabled></div>
        <button class="btn btn-green btn-block" onclick="savePayment('${id}')">تأكيد الدفع</button>
      `);
    }
    function savePayment(id){
      const amt = parseFloat(document.getElementById('payAmt').value);
      if(isNaN(amt) || amt<=0){ toast('أدخل مبلغًا صحيحًا'); return; }
      const type = document.querySelector('#paySeg button.active').dataset.v;
      const w = state.workers.find(x=>x.id===id);
      getEntry(id).payments.push({ id: uid(), amount: amt, type, createdAt: nowISO() });
      const c = calcWorker(id);
      if(c.remaining<=0){
        archiveAndResetWorker(id);
        persist(); closeModal(); render();
        toast('تم تسديد كامل المستحق لـ ' + (w?w.name:'') + ' — بدأ جرد جديد له');
      } else {
        persist(); closeModal(); render();
        toast('تم تسجيل الدفعة');
      }
    }
    function editPayment(id, pId){
      const e = getEntry(id);
      const p = e.payments.find(x=>x.id===pId);
      const type = p.type || 'partial';
      showModal(`
        <div class="sheet-handle"></div>
        <h2>تعديل الدفعة</h2>
        <div class="field">
          <label>نوع الدفعة</label>
          <div class="seg" id="payEditSeg">
            <button type="button" class="${type==='full'?'active':''}" data-v="full" onclick="pickSeg('payEditSeg',this)">دفعة كاملة</button>
            <button type="button" class="${type==='partial'?'active':''}" data-v="partial" onclick="pickSeg('payEditSeg',this)">دفعة جزئية</button>
          </div>
        </div>
        <div class="field"><label>المبلغ (${cur()})</label><input id="payEditAmt" type="number" inputmode="decimal" class="big-input" style="font-size:24px;padding:12px;" value="${p.amount}"></div>
        <button class="btn btn-primary btn-block" onclick="savePaymentEdit('${id}','${pId}')">حفظ</button>
      `);
    }
    function savePaymentEdit(id,pId){
      const amt = parseFloat(document.getElementById('payEditAmt').value);
      if(isNaN(amt)||amt<=0){ toast('أدخل مبلغًا صحيحًا'); return; }
      const type = document.querySelector('#payEditSeg button.active').dataset.v;
      const e = getEntry(id);
      const p = e.payments.find(x=>x.id===pId);
      p.amount = amt;
      p.type = type;
      persist(); closeModal(); render();
    }
    function deletePayment(id,pId){
      const e = getEntry(id);
      e.payments = e.payments.filter(x=>x.id!==pId);
      persist(); render();
      toast('تم حذف الدفعة');
    }

    /* ============================================================
       JARD FLOW (السحب/الجرد)
       ============================================================ */
    function renderJardList(){
      let list = activeWorkers();
      if(list.length===0) return emptyState(ICONS.clipboard,'لا يوجد عمال','أضف عمالًا أولًا من الصفحة الرئيسية');
      let h = '';
      list.slice().sort((a,b)=>a.name.localeCompare(b.name,'ar')).forEach(w=>{
        const e = getEntry(w.id);
        h += `<div class="jrow" onclick="openJardRowAction('${w.id}')">
          <div class="name">${esc(w.name)}</div>
          <div class="status ${e.done?'done':'pending'}">${e.done? ICONS.check+' تم':'لم يبدأ'}</div>
        </div>`;
      });
      return h;
    }
    function openJardRowAction(id){
      const e = getEntry(id);
      if(e.done){ confirmNewJard(id); }
      else { go('jardEntry',{id}); }
    }
    function confirmNewJard(id){
      const w = state.workers.find(x=>x.id===id);
      if(!w) return;
      showModal(`
        <div class="sheet-handle"></div>
        <h2>بدء جرد جديد</h2>
        <div class="desc">تم تسجيل بيانات ${esc(w.name)} مسبقًا لهذه الفترة (أيام، سحوبات، دفعات). هل تريد حفظ نسخة من هذه البيانات في الأرشيف والبدء بجرد جديد فارغ له؟</div>
        <div class="btn-row" style="margin-top:6px;">
          <button class="btn btn-outline btn-block" onclick="closeModal(); go('jardEntry',{id:'${id}'})">متابعة تعديل الحالي</button>
          <button class="btn btn-gold btn-block" onclick="startNewJardForWorker('${id}')">${ICONS.clipboard} جرد جديد</button>
        </div>
      `);
    }
    function archiveAndResetWorker(id){
      const e = state.cycle.entries[id];
      if(e && (e.days!=null || (e.withdrawals&&e.withdrawals.length) || (e.payments&&e.payments.length))){
        const snapshot = JSON.parse(JSON.stringify(e));
        state.archive.unshift({ id: uid(), startDate: state.cycle.startDate, closedDate: nowISO(), entries: { [id]: snapshot } });
      }
      state.cycle.entries[id] = { days:null, withdrawals:[], payments:[], done:false, motoDays:null };
      if(state.cycle.attendance){
        Object.keys(state.cycle.attendance).forEach(dateKey=>{
          if(state.cycle.attendance[dateKey][id]) delete state.cycle.attendance[dateKey][id];
        });
      }
    }
    function startNewJardForWorker(id){
      const w = state.workers.find(x=>x.id===id);
      archiveAndResetWorker(id);
      persist();
      closeModal();
      toast('تم حفظ نسخة وبدء جرد جديد لـ ' + (w?w.name:''));
      go('jardEntry',{id});
    }

    function renderJardEntry(id){
      const w = state.workers.find(x=>x.id===id);
      if(!w) return emptyState(ICONS.warning,'العامل غير موجود','');
      const e = getEntry(id);
      let h = `<div class="step-head"><div class="who">${esc(w.name)}</div><div class="prompt">تسجيل بيانات الجرد لهذه الفترة</div></div>`;

      h += `<div class="section-title">1) كم يومًا أتى للعمل؟</div>
      <input id="jardDays" type="number" inputmode="numeric" class="big-input" value="${e.days!=null?e.days:''}" placeholder="عدد الأيام" oninput="autoSaveJardDays('${id}', this.value)">`;

      let stepN = 2;
      if(w.hasMoto){
        h += `<div class="section-title" style="margin-top:22px;">${stepN}) 🏍 كم يومًا أحضر المتور ؟</div>
        <input id="jardMotoDays" type="number" inputmode="numeric" class="big-input" value="${e.motoDays!=null?e.motoDays:''}" placeholder="عدد الأيام" oninput="autoSaveJardMotoDays('${id}', this.value)">
        <div style="font-size:11.5px;color:var(--text2);margin-top:6px;">حساب المتور: ${fmt(w.motoRate)} ${cur()} / يوم</div>`;
        stepN++;
      }

      h += `<div class="section-title" style="margin-top:22px;">${stepN}) السحوبات والغرامات</div>`;
      if(e.withdrawals.length===0){
        h += `<div class="entry-row"><div class="info"><div class="t">لا يوجد سحب مسجل</div></div></div>`;
      } else {
        const sortedWd = [...e.withdrawals].sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
        sortedWd.forEach(wd=>{
          h += `<div class="entry-row">
            <div class="info"><div class="t">${fmt(wd.amount)} ${cur()} <span class="tag ${wd.type}">${typeLabel(wd.type)}</span></div>${wd.note?`<div class="s">${esc(wd.note)}</div>`:''}</div>
            <div class="acts"><button class="mini-btn danger" onclick="deleteWithdrawal('${id}','${wd.id}'); go('jardEntry',{id:'${id}'})">${ICONS.close}</button></div>
          </div>`;
        });
      }
      h += `<button class="btn btn-outline btn-block" onclick="quickAddWithdrawal('${id}')">${ICONS.plus} إضافة سحب رقم ${e.withdrawals.length+1}</button>`;

      h += `<div style="margin-top:26px;display:flex;flex-direction:column;gap:10px;">
        <button class="btn btn-green btn-block" onclick="finishJardWorker('${id}')">${ICONS.checkCircle} إنهاء هذا العامل والانتقال للتالي</button>
        <button class="btn btn-red btn-block" onclick="archiveWorker('${id}')">${ICONS.archive} نقل العامل للأرشيف</button>
      </div>`;
      return h;
    }
    function autoSaveJardDays(id, val){
      const v = parseFloat(val);
      getEntry(id).days = (val===''||isNaN(v)) ? null : v;
      persist();
    }
    function autoSaveJardMotoDays(id, val){
      const v = parseFloat(val);
      getEntry(id).motoDays = (val===''||isNaN(v)) ? null : v;
      persist();
    }
    function quickAddWithdrawal(id){
      showModal(`
        <div class="sheet-handle"></div>
        <h2>إضافة سحوبات / غرامات / مقدم</h2>
        <div class="desc">أدخل المبلغ واضغط ⏎ (إدخال) لإضافته والانتقال مباشرة للعملية التالية دون توقف. اضغط "تم" عند الانتهاء من كل العمليات.</div>
        <div class="field">
          <label>النوع</label>
          <div class="seg small" id="typeSeg">
            <button type="button" class="active" data-v="normal" onclick="pickSeg('typeSeg',this)">سحب</button>
            <button type="button" data-v="advance" onclick="pickSeg('typeSeg',this)">مقدم</button>
          </div>
        </div>
        <div class="field"><label>المبلغ (${cur()})</label><input id="wdAmt" type="number" inputmode="decimal" enterkeyhint="done" class="big-input" style="font-size:24px;padding:12px;" placeholder="0" onkeydown="if(event.key==='Enter'){event.preventDefault(); quickAddOne('${id}');}"></div>
        <div id="wdNoteWrap">
          <button type="button" class="btn btn-sm btn-soft" onclick="showQuickNoteField('${id}')">${ICONS.note} إضافة ملاحظة</button>
        </div>
        <div id="quickAddedList"></div>
        <div class="btn-row" style="margin-top:6px;">
          <button class="btn btn-outline btn-block" onclick="quickAddOne('${id}')">${ICONS.plus} إضافة والمتابعة</button>
          <button class="btn btn-primary btn-block" onclick="closeModal(); go('jardEntry',{id:'${id}'})">${ICONS.check} تم</button>
        </div>
      `);
      renderQuickAddedList(id);
      setTimeout(()=>{ const el=document.getElementById('wdAmt'); if(el) el.focus(); }, 50);
    }
    function showQuickNoteField(id){
      const wrap = document.getElementById('wdNoteWrap');
      wrap.innerHTML = `<div class="field"><label>ملاحظة (اختياري)</label><input id="wdNote" enterkeyhint="done" placeholder="مثال: سلفة شخصية" onkeydown="if(event.key==='Enter'){event.preventDefault(); quickAddOne('${id}');}"></div>`;
      document.getElementById('wdNote').focus();
    }
    function quickAddOne(id){
      const amtEl = document.getElementById('wdAmt');
      const amt = parseFloat(amtEl.value);
      if(isNaN(amt) || amt<=0){ toast('أدخل مبلغًا صحيحًا'); amtEl.focus(); return; }
      const type = document.querySelector('#typeSeg button.active').dataset.v;
      const noteEl = document.getElementById('wdNote');
      const note = noteEl ? noteEl.value.trim() : '';
      getEntry(id).withdrawals.push({ id: uid(), amount: amt, type, note, createdAt: nowISO() });
      persist();
      amtEl.value = '';
      // نُعيد حقل الملاحظة إلى وضعه المخفي الافتراضي لأن أغلب السحوبات تُضاف بدون ملاحظة
      document.getElementById('wdNoteWrap').innerHTML = `<button type="button" class="btn btn-sm btn-soft" onclick="showQuickNoteField('${id}')">${ICONS.note} إضافة ملاحظة</button>`;
      renderQuickAddedList(id);
      toast('تمت الإضافة — أدخل العملية التالية');
      amtEl.focus();
    }
    function renderQuickAddedList(id){
      const box = document.getElementById('quickAddedList');
      if(!box) return;
      const list = getEntry(id).withdrawals;
      if(list.length===0){ box.innerHTML=''; return; }
      const sortedWd = [...list].sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
      box.innerHTML = `<div class="section-title" style="margin-top:16px;">أُضيف حتى الآن (${list.length})</div>` + sortedWd.map(wd=>`
        <div class="entry-row">
          <div class="info"><div class="t">${fmt(wd.amount)} ${cur()} <span class="tag ${wd.type}">${typeLabel(wd.type)}</span></div>${wd.note?`<div class="s">${esc(wd.note)}</div>`:''}</div>
          <div class="acts"><button class="mini-btn danger" onclick="deleteWithdrawal('${id}','${wd.id}'); renderQuickAddedList('${id}')">${ICONS.close}</button></div>
        </div>`).join('');
    }
    function finishJardWorker(id){
      const inp = document.getElementById('jardDays');
      if(inp){
        const v = parseFloat(inp.value);
        getEntry(id).days = (inp.value===''||isNaN(v)) ? getEntry(id).days : v;
      }
      const e = getEntry(id);
      if(e.days==null){ toast('الرجاء إدخال عدد أيام الحضور أولًا'); return; }
      e.done = true;
      persist();
      toast('تم تسجيل بيانات ' + (state.workers.find(w=>w.id===id)||{}).name);
      // move to next pending worker if any
      const list = activeWorkers().sort((a,b)=>a.name.localeCompare(b.name,'ar'));
      const next = list.find(w=>!getEntry(w.id).done && w.id!==id);
      if(next) go('jardEntry',{id:next.id});
      else go('jardList');
    }

    /* ============================================================
       TABLE (كشف الحساب العام)
       ============================================================ */
    function renderTable(){
      const rows = activeWorkers().map(w=>({w, c:calcWorkerData(w, state.cycle.entries[w.id])})).filter(r=>r.c.hasData);
      if(rows.length===0) return emptyState(ICONS.chart,'لا توجد بيانات مُدخلة بعد','ابدأ الجرد أولًا من الصفحة الرئيسية');
      const anyMoto = rows.some(({w})=>w.hasMoto);
      let totDays=0, totMoto=0, totW=0, totAdv=0, totNet=0, totPaid=0, totRem=0;
      let body = '';
      rows.sort((a,b)=>a.w.name.localeCompare(b.w.name,'ar')).forEach(({w,c})=>{
        totDays+=c.days; totMoto+=c.motoTotal; totW+=c.totalWithdrawals; totAdv+=c.totalAdvance; totNet+=c.earnings; totPaid+=c.totalPaid; totRem+=c.remaining;
        body += `<tr onclick="go('workerDetail',{id:'${w.id}'})">
          <td>${esc(w.name)}</td><td>${c.days}</td>${anyMoto?`<td>${w.hasMoto? (c.motoDays+' — '+fmt(c.motoTotal)) : '—'}</td>`:''}<td>${fmt(c.totalWithdrawals)}</td><td>${fmt(c.totalAdvance)}</td>
          <td>${fmt(c.earnings)}</td><td>${fmt(c.totalPaid)}</td><td style="color:${c.remaining>0?'var(--red)':'var(--green)'};font-weight:800;">${fmt(c.remaining)}</td>
          <td><button class="btn btn-sm btn-green" onclick="event.stopPropagation(); openPaymentModal('${w.id}')" ${c.remaining<=0?'disabled':''}>دفع</button></td>
        </tr>`;
      });
      return `<div class="table-wrap"><table>
        <thead><tr><th>الاسم</th><th>أيام</th>${anyMoto?'<th>🏍 المتور</th>':''}<th>سحوبات</th><th>مقدم</th><th>إجمالي مستحق العمل</th><th>الدفعات</th><th>المتبقي</th><th></th></tr></thead>
        <tbody>${body}</tbody>
        <tfoot><tr><td>الإجمالي</td><td>${totDays}</td>${anyMoto?`<td>${fmt(totMoto)}</td>`:''}<td>${fmt(totW)}</td><td>${fmt(totAdv)}</td><td>${fmt(totNet)}</td><td>${fmt(totPaid)}</td><td>${fmt(totRem)}</td><td></td></tr></tfoot>
      </table></div>
      <div style="font-size:11.5px;color:var(--text2);margin-top:10px;text-align:center;">مرّر الجدول يمينًا / يسارًا لرؤية كل الأعمدة، واضغط على أي عامل لعرض كشفه التفصيلي</div>`;
    }

    function confirmPayAll(){
      const rows = activeWorkers().map(w=>({w,c:calcWorker(w.id)})).filter(r=>r.c.hasData && r.c.remaining>0);
      if(rows.length===0){ toast('لا يوجد مبالغ متبقية لأي عامل'); return; }
      const total = rows.reduce((s,r)=>s+r.c.remaining,0);
      showModal(`
        <div class="sheet-handle"></div>
        <h2>تأكيد دفع جميع المستحقات؟</h2>
        <div class="desc">سيتم تسجيل دفعة بكامل المبلغ المتبقي لكل عامل (${rows.length} عامل)، بإجمالي ${fmt(total)} ${cur()}، ثم يبدأ جرد جديد فارغ لكل منهم. لا يمكن التراجع عن هذا الإجراء.</div>
        <div class="btn-row" style="margin-top:14px;">
          <button class="btn btn-outline btn-block" onclick="closeModal()">إلغاء</button>
          <button class="btn btn-green btn-block" onclick="payAllRemaining()">${ICONS.checkCircle} تأكيد الدفع للجميع</button>
        </div>
      `);
    }
    function payAllRemaining(){
      const rows = activeWorkers().map(w=>({w,c:calcWorker(w.id)})).filter(r=>r.c.hasData && r.c.remaining>0);
      rows.forEach(({w,c})=>{
        getEntry(w.id).payments.push({ id: uid(), amount: c.remaining, type:'full', createdAt: nowISO() });
        archiveAndResetWorker(w.id);
      });
      persist(); closeModal(); go('table');
      toast('تم تسجيل دفع جميع المستحقات وبدء جرد جديد للكل');
    }

    function confirmCloseCycle(){
      const rows = activeWorkers().map(w=>calcWorker(w.id)).filter(c=>c.hasData);
      if(rows.length===0){ toast('لا توجد بيانات لإغلاقها'); return; }
      const totRem = rows.reduce((s,c)=>s+c.remaining,0);
      showModal(`
        <div class="sheet-handle"></div>
        <h2>إغلاق الدورة الحالية؟</h2>
        <div class="desc">سيتم أرشفة جميع البيانات الحالية في السجل التاريخي، ثم تبدأ دورة جديدة فارغة. لا يمكن التراجع عن هذا الإجراء.</div>
        ${totRem>0? `<div class="entry-row" style="border-color:var(--red);"><div class="info"><div class="t" style="color:var(--red);">تنبيه</div><div class="s">هناك ${fmt(totRem)} ${cur()} غير مدفوعة بعد لبعض العمال</div></div></div>` : ''}
        <div class="btn-row" style="margin-top:14px;">
          <button class="btn btn-outline btn-block" onclick="closeModal()">إلغاء</button>
          <button class="btn btn-red btn-block" onclick="closeCycle()">تأكيد الإغلاق</button>
        </div>
      `);
    }
    function closeCycle(){
      const snapshot = JSON.parse(JSON.stringify(state.cycle));
      state.archive.unshift({ id: uid(), startDate: state.cycle.startDate, closedDate: nowISO(), entries: snapshot.entries });
      state.cycle = { startDate: nowISO(), entries: {}, attendance: {} };
      persist(); closeModal(); go('home');
      toast('تم إغلاق الدورة وبدء دورة جديدة');
    }

    /* ============================================================
       PAYMENTS LOG (كشف الدفعات)
       ============================================================ */
    function renderPaymentsLog(){
      let items = [];
      state.workers.forEach(w=>{
        const e = state.cycle.entries[w.id];
        if(e && e.payments) e.payments.forEach(p=> items.push({worker:w, p}));
      });
      state.archive.forEach(cy=>{
        Object.keys(cy.entries).forEach(wid=>{
          const w = state.workers.find(x=>x.id===wid);
          if(!w) return;
          const e = cy.entries[wid];
          if(e && e.payments) e.payments.forEach(p=> items.push({worker:w, p}));
        });
      });
      items.sort((a,b)=> new Date(b.p.createdAt) - new Date(a.p.createdAt));
      if(items.length===0) return emptyState(ICONS.wallet,'لا توجد دفعات مسجلة بعد','');
      let h = '';
      let total = 0;
      items.forEach(({worker,p})=>{
        total += Number(p.amount);
        h += `<div class="entry-row">
          <div class="info"><div class="t">${esc(worker.name)} ${p.type?`<span class="tag ${p.type}">${p.type==='full'?'كاملة':'جزئية'}</span>`:''}</div><div class="s">${new Date(p.createdAt).toLocaleDateString('ar-EG',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}</div></div>
          <div class="amt" style="color:var(--green)">${fmt(p.amount)} ${cur()}</div>
        </div>`;
      });
      return `<div class="pill" style="margin-bottom:12px;">إجمالي المدفوع: ${fmt(total)} ${cur()}</div>` + h;
    }

    /* ============================================================
       ARCHIVED WORKERS
       ============================================================ */
    function renderArchivedWorkers(){
      const list = state.workers.filter(w=>w.archived);
      if(list.length===0) return emptyState(ICONS.archive,'لا يوجد عمال مؤرشفون','');
      let h='';
      list.forEach(w=>{
        h += `<div class="jrow"><div class="name">${esc(w.name)}</div><button class="btn btn-sm btn-soft" onclick="restoreWorker('${w.id}')">استعادة</button></div>`;
      });
      return h;
    }

    /* ============================================================
       CYCLES ARCHIVE (history)
       ============================================================ */
    function renderCyclesArchive(){
      if(state.archive.length===0) return emptyState(ICONS.archive,'لا يوجد دورات مغلقة بعد','ستظهر هنا الدورات بعد إغلاقها من صفحة الجدول');
      let h='';
      state.archive.forEach(cy=>{
        const ids = Object.keys(cy.entries);
        let net=0, rem=0;
        ids.forEach(id=>{
          const e = cy.entries[id];
          const w = state.workers.find(x=>x.id===id);
          const gross = (e.days||0) * (w?w.dailyRate:0);
          const motoTotal = (e.motoDays||0) * ((w&&w.hasMoto)?Number(w.motoRate||0):0);
          const earnings = gross + motoTotal;
          const { deductions: totW, advance: totAdv } = splitWithdrawals(e.withdrawals);
          const totP = (e.payments||[]).reduce((s,x)=>s+Number(x.amount||0),0);
          net += earnings-totW; rem += (earnings-totW+totAdv-totP);
        });
        h += `<div class="jrow" onclick="go('cycleDetail',{id:'${cy.id}'})">
          <div><div class="name">دورة ${new Date(cy.closedDate).toLocaleDateString('ar-EG',{day:'numeric',month:'long',year:'numeric'})}</div>
          <div style="font-size:11.5px;color:var(--text2);">الصافي: ${fmt(net)} ${cur()}</div></div>
          <div class="status ${rem<=0?'done':'pending'}">${rem<=0?'مسددة':'متبقي'}</div>
        </div>`;
      });
      return h;
    }
    function renderCycleDetail(cyId){
      const cy = state.archive.find(x=>x.id===cyId);
      if(!cy) return emptyState(ICONS.warning,'غير موجود','');
      const ids = Object.keys(cy.entries);
      let body='', totDays=0,totMoto=0,totW=0,totAdv=0,totNet=0,totRem=0;
      const anyMoto = ids.some(id=>{ const w=state.workers.find(x=>x.id===id); return w&&w.hasMoto; });
      ids.forEach(id=>{
        const w = state.workers.find(x=>x.id===id);
        if(!w) return;
        const e = cy.entries[id];
        const gross = (e.days||0)*w.dailyRate;
        const motoTotal = (e.motoDays||0) * (w.hasMoto?Number(w.motoRate||0):0);
        const earnings = gross + motoTotal;
        const { deductions: totWd, advance: totAd } = splitWithdrawals(e.withdrawals);
        const totP = (e.payments||[]).reduce((s,x)=>s+Number(x.amount||0),0);
        const net = earnings-totWd, rem = net+totAd-totP;
        totDays+=(e.days||0); totMoto+=motoTotal; totW+=totWd; totAdv+=totAd; totNet+=earnings; totRem+=rem;
        body += `<tr><td>${esc(w.name)}</td><td>${e.days||0}</td>${anyMoto?`<td>${w.hasMoto?fmt(motoTotal):'—'}</td>`:''}<td>${fmt(totWd)}</td><td>${fmt(totAd)}</td><td>${fmt(earnings)}</td><td>${fmt(rem)}</td></tr>`;
      });
      return `<div style="font-size:12.5px;color:var(--text2);margin-bottom:10px;">
        من ${new Date(cy.startDate).toLocaleDateString('ar-EG',{day:'numeric',month:'long'})}
        إلى ${new Date(cy.closedDate).toLocaleDateString('ar-EG',{day:'numeric',month:'long',year:'numeric'})}
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>الاسم</th><th>أيام</th>${anyMoto?'<th>🏍 المتور</th>':''}<th>سحوبات</th><th>مقدم</th><th>إجمالي مستحق العمل</th><th>المتبقي</th></tr></thead>
        <tbody>${body}</tbody>
        <tfoot><tr><td>الإجمالي</td><td>${totDays}</td>${anyMoto?`<td>${fmt(totMoto)}</td>`:''}<td>${fmt(totW)}</td><td>${fmt(totAdv)}</td><td>${fmt(totNet)}</td><td>${fmt(totRem)}</td></tr></tfoot>
      </table></div>`;
    }

    /* ============================================================
       STATS
       ============================================================ */
    function renderStats(){
      const rows = activeWorkers().map(w=>({w,c:calcWorker(w.id)})).filter(r=>r.c.hasData);
      const totGross = rows.reduce((s,r)=>s+r.c.gross,0);
      const totMoto = rows.reduce((s,r)=>s+r.c.motoTotal,0);
      const totW = rows.reduce((s,r)=>s+r.c.totalWithdrawals,0);
      const totAdv = rows.reduce((s,r)=>s+r.c.totalAdvance,0);
      const totNet = rows.reduce((s,r)=>s+r.c.net,0);
      const totPaid = rows.reduce((s,r)=>s+r.c.totalPaid,0);
      const totRem = rows.reduce((s,r)=>s+r.c.remaining,0);
      let topWorker = null;
      rows.forEach(r=>{ if(!topWorker || r.c.totalWithdrawals>topWorker.c.totalWithdrawals) topWorker=r; });

      let h = `
      <div class="two-col">
        <div class="stat-card"><div class="lbl">إجمالي أجور الأيام</div><div class="big">${fmt(totGross)}</div></div>
        ${totMoto>0?`<div class="stat-card"><div class="lbl">🏍 إجمالي حساب المتور</div><div class="big" style="color:var(--gold)">${fmt(totMoto)}</div></div>`:''}
        <div class="stat-card"><div class="lbl">إجمالي السحوبات والغرامات</div><div class="big" style="color:var(--red)">${fmt(totW)}</div></div>
        <div class="stat-card"><div class="lbl">إجمالي الصافي</div><div class="big">${fmt(totNet)}</div></div>
        <div class="stat-card"><div class="lbl">إجمالي المقدمات</div><div class="big" style="color:var(--blue)">${fmt(totAdv)}</div></div>
        <div class="stat-card"><div class="lbl">إجمالي المدفوع</div><div class="big" style="color:var(--green)">${fmt(totPaid)}</div></div>
        <div class="stat-card"><div class="lbl">عدد العمال النشطين</div><div class="big">${activeWorkers().length}</div></div>
      </div>
      <div class="stat-card"><div class="lbl">إجمالي المتبقي لجميع العمال</div><div class="big" style="color:${totRem>0?'var(--red)':'var(--green)'}">${fmt(totRem)} ${cur()}</div></div>
      ${topWorker? `<div class="stat-card"><div class="lbl">أكثر عامل سحوبات هذه الدورة</div><div class="big">${esc(topWorker.w.name)}</div><div class="lbl">${fmt(topWorker.c.totalWithdrawals)} ${cur()}</div></div>` : ''}
      `;

      if(state.archive.length>0){
        h += `<div class="section-title" style="margin-top:16px;">مقارنة بالدورات السابقة</div>`;
        state.archive.slice(0,6).forEach(cy=>{
          const ids = Object.keys(cy.entries);
          let net=0;
          ids.forEach(id=>{
            const w = state.workers.find(x=>x.id===id);
            const e = cy.entries[id];
            const gross=(e.days||0)*(w?w.dailyRate:0);
            const motoTotal=(e.motoDays||0)*((w&&w.hasMoto)?Number(w.motoRate||0):0);
            const { deductions: totWd } = splitWithdrawals(e.withdrawals);
            net += gross+motoTotal-totWd;
          });
          h += `<div class="entry-row"><div class="info"><div class="t">${new Date(cy.closedDate).toLocaleDateString('ar-EG',{day:'numeric',month:'long'})}</div></div><div class="amt">${fmt(net)} ${cur()}</div></div>`;
        });
      }
      return h;
    }

    /* ============================================================
       SETTINGS
       ============================================================ */
    function renderSettings(){
      return `
      <div class="stat-card">
        <div class="field" style="margin-bottom:0;">
          <label>عملة العرض</label>
          <input id="currInput" value="${esc(cur())}" oninput="updateCurrency(this.value)">
        </div>
      </div>
      <div class="menu-item" onclick="toggleDarkMode()"><div class="ic ic-slate">${darkMode?ICONS.sun:ICONS.moon}</div><div>${darkMode?'الوضع الفاتح':'الوضع الداكن'}</div></div>
      <div class="menu-item" onclick="go('archivedWorkers')"><div class="ic ic-slate">${ICONS.archive}</div><div>العمال المؤرشفون</div></div>
      <div class="menu-item" onclick="go('cyclesArchive')"><div class="ic ic-slate">${ICONS.archive}</div><div>أرشيف الدورات السابقة</div></div>
      <div class="menu-item" onclick="go('payments')"><div class="ic ic-gold">${ICONS.wallet}</div><div>كشف جميع الدفعات</div></div>
      <div class="menu-item" onclick="togglePinFlow()"><div class="ic ic-rust">${ICONS.lock}</div><div>${state.settings.pinEnabled? 'تغيير / إلغاء رمز القفل':'تفعيل رمز القفل'}</div></div>
      <div class="menu-item" onclick="exportBackup()"><div class="ic ic-blue">${ICONS.download}</div><div>تنزيل نسخة احتياطية (JSON)</div></div>
      <div class="menu-item" onclick="triggerImport()"><div class="ic ic-green">${ICONS.upload}</div><div>استيراد نسخة احتياطية</div></div>
      <input type="file" id="importFile" accept=".json" class="hidden" onchange="importBackup(event)">
      <div style="font-size:11.5px;color:var(--text2);text-align:center;margin-top:16px;line-height:1.7;">
        يتم حفظ جميع بياناتك تلقائيًا على هذا الجهاز بعد كل تعديل.<br>يُنصح بتنزيل نسخة احتياطية دوريًا لحفظها خارج التطبيق.
      </div>
      ${signatureCardHTML()}`;
    }
    function signatureCardHTML(){
      const phone = '780649029';
      const intl = '967'+phone;
      return `
      <div class="sig-card">
        <img src="data:image/png;base64,${LOGO_B64}" alt="" class="sig-logo" style="width:64px;height:64px;border-radius:16px;">
        <div class="sig-name">Digital Shadow IT Solutions</div>
        <div class="sig-role">المهندس خالد نصر أحمد سيلان الطهيف — تصميم وتطوير التطبيق</div>
        <div class="sig-row">
          <a class="sig-btn call" href="tel:+${intl}">${ICONS.phone}<span>اتصال</span></a>
          <a class="sig-btn wa" href="https://wa.me/${intl}" target="_blank" rel="noopener">${ICONS.chat}<span>واتساب</span></a>
        </div>
        <div class="sig-num" dir="ltr">+${intl}</div>
      </div>`;
    }
    function updateCurrency(v){
      state.settings.currency = v || 'ر.ي';
      persist();
    }
    function exportBackup(){
      const data = JSON.stringify(state, null, 2);
      const filename = 'ledger-backup-'+new Date().toISOString().slice(0,10)+'.json';

      if (window.AndroidBridge && window.AndroidBridge.saveFile) {
        // Encode JSON string to Base64
        const base64 = btoa(unescape(encodeURIComponent(data)));
        window.AndroidBridge.saveFile(base64, filename, 'application/json');
        return;
      }

      const blob = new Blob([data], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 2000);
      toast('تم تنزيل النسخة الاحتياطية');
    }
    function triggerImport(){ document.getElementById('importFile').click(); }
    function importBackup(ev){
      const file = ev.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try{
          const data = JSON.parse(reader.result);
          if(!data.workers || !data.cycle) throw new Error('bad format');
          state = data;
          persist(); render();
          toast('تم استيراد النسخة الاحتياطية بنجاح');
        }catch(e){ toast('ملف غير صالح'); }
      };
      reader.readAsText(file);
    }

    /* ============================================================

    function showModal(innerHTML){

    /* ============================================================
       EXPORT / PRINT
       ============================================================ */
    function buildWorkerReportHTML(id){
      const w = state.workers.find(x=>x.id===id);
      const e = getEntry(id);
      const c = calcWorker(id);
      let wdRows = e.withdrawals.map(wd=>`<tr><td>${typeLabel(wd.type)}</td><td>${fmt(wd.amount)} ${cur()}</td><td>${esc(wd.note||'')}</td></tr>`).join('');
      if(!wdRows) wdRows = `<tr><td colspan="3" style="text-align:center;color:#999;">لا يوجد سحوبات</td></tr>`;
      let payRows = [...e.payments].sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt)).map(p=>`<tr><td>${new Date(p.createdAt).toLocaleDateString('ar-EG')}</td><td>${fmt(p.amount)} ${cur()}</td><td>${p.type==='full'?'دفعة كاملة':(p.type==='partial'?'دفعة جزئية':'—')}</td></tr>`).join('');
      if(!payRows) payRows = `<tr><td colspan="3" style="text-align:center;color:#999;">لا توجد دفعات</td></tr>`;

      return `
      <div class="rep-container">
        <div class="rep-header">
          <div class="rep-title">كشف حساب العامل</div>
          <div class="rep-worker-name">${esc(w.name)}</div>
          <div class="rep-date">${todayStr()}</div>
        </div>

        <div class="rep-section-title">بيانات الأجر والحضور</div>
        <table class="rep-main-table">
          <tr><th>الأجر اليومي</th><td>${fmt(w.dailyRate)} ${cur()}</td></tr>
          <tr><th>أيام الحضور</th><td>${c.days} يوم</td></tr>
          ${w.hasMoto?`<tr><th>حساب المتور اليومي</th><td>${fmt(w.motoRate)} ${cur()}</td></tr><tr><th>أيام إحضار المتور</th><td>${c.motoDays} يوم</td></tr>`:''}
          <tr class="highlight"><th>إجمالي مستحق العمل</th><td>${fmt(c.earnings)} ${cur()}</td></tr>
        </table>

        <div class="rep-section-title">السحوبات والغرامات</div>
        <table class="rep-data-table">
          <thead><tr><th>النوع</th><th>المبلغ</th><th>ملاحظة</th></tr></thead>
          <tbody>${wdRows}</tbody>
        </table>

        <div class="rep-section-title">الدفعات المستلمة</div>
        <table class="rep-data-table">
          <thead><tr><th>التاريخ</th><th>المبلغ</th><th>الحالة</th></tr></thead>
          <tbody>${payRows}</tbody>
        </table>

        <div class="rep-summary">
          <div class="sum-row"><span>إجمالي مستحق العمل:</span><span>${fmt(c.earnings)} ${cur()}</span></div>
          <div class="sum-row"><span>إجمالي السحوبات:</span><span class="neg">-${fmt(c.totalWithdrawals)} ${cur()}</span></div>
          <div class="sum-row"><span>المقدم (دين مضاف):</span><span class="pos">+${fmt(c.totalAdvance)} ${cur()}</span></div>
          <div class="sum-row"><span>إجمالي المبلغ المدفوع:</span><span class="green">${fmt(c.totalPaid)} ${cur()}</span></div>
          <div class="sum-row bold"><span>الصافي المستحق:</span><span>${fmt(c.totalDue)} ${cur()}</span></div>
          <div class="sum-row separator"></div>
          <div class="sum-row final"><span>المبلغ المتبقي:</span><span class="rem">${fmt(c.remaining)} ${cur()}</span></div>
        </div>
      </div>`;
    }

    function buildTableReportHTML(){
      const rows = activeWorkers().map(w=>({w,c:calcWorkerData(w, state.cycle.entries[w.id])})).filter(r=>r.c.hasData);
      const anyMoto = rows.some(({w})=>w.hasMoto);
      let totDays=0,totMoto=0,totW=0,totAdv=0,totNet=0,totPaid=0,totRem=0;
      let body = rows.map(({w,c})=>{
        totDays+=c.days; totMoto+=c.motoTotal; totW+=c.totalWithdrawals; totAdv+=c.totalAdvance; totNet+=c.earnings; totPaid+=c.totalPaid; totRem+=c.remaining;
        return `<tr>
          <td style="text-align:center;">${esc(w.name)}</td>
          <td>${c.days}</td>
          ${anyMoto?`<td>${w.hasMoto?fmt(c.motoTotal):'—'}</td>`:''}
          <td>${fmt(c.totalWithdrawals)}</td>
          <td>${fmt(c.totalAdvance)}</td>
          <td>${fmt(c.earnings)}</td>
          <td>${fmt(c.totalPaid)}</td>
          <td class="bold">${fmt(c.remaining)}</td>
        </tr>`;
      }).join('');

      return `
      <div class="rep-container">
        <div class="rep-header">
          <div class="rep-title">الجدول الإجمالي للدورة الحالية</div>
          <div class="rep-date">${todayStr()}</div>
        </div>
        <table class="rep-data-table">
          <thead>
            <tr>
              <th style="text-align:center;">اسم العامل</th>
              <th>أيام</th>
              ${anyMoto?'<th>المتور</th>':''}
              <th>سحوبات</th>
              <th>مقدم</th>
              <th>إجمالي مستحق العمل</th>
              <th>الدفعات</th>
              <th>المتبقي</th>
            </tr>
          </thead>
          <tbody>${body}</tbody>
          <tfoot style="background:#f8f9fa; font-weight:bold; border-top:2px solid #333;">
            <tr>
              <td style="text-align:center;">الإجمالي العام</td>
              <td>${totDays}</td>
              ${anyMoto?`<td>${fmt(totMoto)}</td>`:''}
              <td>${fmt(totW)}</td>
              <td>${fmt(totAdv)}</td>
              <td>${fmt(totNet)}</td>
              <td>${fmt(totPaid)}</td>
              <td>${fmt(totRem)} ${cur()}</td>
            </tr>
          </tfoot>
        </table>
        <div style="margin-top:20px; font-size:12px; color:#666; text-align:center;">طُبع بواسطة تطبيق دفتر الحساب</div>
      </div>`;
    }

    function doPrint(contentHTML) {
      const fullHTML = `
      <!DOCTYPE html>
      <html lang="ar" dir="rtl">
      <head>
        <meta charset="UTF-8">
        <style>
          body { font-family: system-ui, -apple-system, sans-serif; direction: rtl; padding: 20px; color: #1e293b; line-height: 1.5; background: #fff; }
          .rep-container { max-width: 800px; margin: 0 auto; }

          .highlight { background-color: #f8fafc; font-weight: 700; }
          .highlight td { color: #0f172a; }
          .rep-main-table th { text-align: center; width: 40%; }
          .rep-main-table td { text-align: center; font-weight: 700; }
          .rep-data-table thead th { background-color: #1e293b; color: #fff; }
          .rep-summary { margin-top: 30px; padding: 20px; background: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0; }
          .sum-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 15px; }

      if(window.AndroidBridge && window.AndroidBridge.printHTML) {
        window.AndroidBridge.printHTML(fullHTML);
      } else {
        toast("نظام الطباعة غير متوفر حالياً، يرجى إعادة تشغيل التطبيق");

    function openExportWorker(id){
      doPrint(buildWorkerReportHTML(id));
    }
    function openExportTable(){
      doPrint(buildTableReportHTML());
    }

    /* ============================================================
       LOCK / PIN
       ============================================================ */
    let pinBuffer = '';
    let pinMode = 'unlock'; // unlock | setup | confirm | change
    let pinFirstEntry = '';

    function renderLock(){
      const root = document.getElementById('lock-root');
      const isSetup = pinMode==='setup' || pinMode==='confirm';
      root.innerHTML = `
      <div class="lock-wrap">
        <img src="data:image/png;base64,${LOGO_B64}" alt="" class="lock-logo">
        <h1>دفتر الحساب</h1>
        <div class="s">${
          pinMode==='unlock' ? 'أدخل رمز القفل للمتابعة' :
          pinMode==='setup' ? 'أنشئ رمز قفل مكوّن من 4 أرقام' :
          'أعد إدخال الرمز للتأكيد'
        }</div>
        <div class="lock-err">${view.params.lockErr||''}</div>
        <div class="dots">${[0,1,2,3].map(i=>`<div class="dot ${i<pinBuffer.length?'filled':''}"></div>`).join('')}</div>
        <div class="keypad">
          ${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="pinPress('${n}')">${n}</button>`).join('')}
          <button onclick="pinSkip()" style="font-size:12px;">${pinMode==='unlock'?'':'تخطي'}</button>
          <button onclick="pinPress('0')">0</button>
          <button onclick="pinBack()">⌫</button>
        </div>
      </div>`;
    }
    function pinPress(d){
      if(pinBuffer.length>=4) return;
      pinBuffer += d;
      view.params.lockErr='';
      renderLock();
      if(pinBuffer.length===4) setTimeout(handlePinComplete, 150);
    }
    function pinBack(){ pinBuffer = pinBuffer.slice(0,-1); renderLock(); }
    function pinSkip(){
      if(pinMode==='setup' || pinMode==='confirm'){
        state.settings.pinEnabled=false; state.settings.pin=null;
        persist(); pinBuffer=''; unlockApp();
      }
    }
    function handlePinComplete(){
      if(pinMode==='unlock'){
        if(pinBuffer===state.settings.pin){ pinBuffer=''; unlockApp(); }
        else { view.params.lockErr='رمز غير صحيح، حاول مرة أخرى'; pinBuffer=''; renderLock(); }
      } else if(pinMode==='setup'){
        pinFirstEntry = pinBuffer; pinBuffer=''; pinMode='confirm'; renderLock();
      } else if(pinMode==='confirm'){
        if(pinBuffer===pinFirstEntry){
          state.settings.pin = pinBuffer; state.settings.pinEnabled=true;
          persist(); pinBuffer=''; toast('تم تفعيل رمز القفل'); unlockApp();
        } else {
          view.params.lockErr='الرمزان غير متطابقين، حاول مجددًا'; pinBuffer=''; pinMode='setup'; renderLock();
        }
      }
    }
    function unlockApp(){
      unlocked = true;
      document.getElementById('lock-root').innerHTML='';
      document.getElementById('app-root').classList.remove('hidden');
      render();
    }
    function togglePinFlow(){
      if(state.settings.pinEnabled){
        showModal(`
          <div class="sheet-handle"></div><h2>رمز القفل</h2>
          <div class="desc">هل تريد تغيير الرمز الحالي أم إلغاؤه؟</div>
          <div class="btn-row">
            <button class="btn btn-outline btn-block" onclick="closeModal(); state.settings.pinEnabled=false; state.settings.pin=null; persist(); toast('تم إلغاء القفل');">إلغاء القفل</button>
            <button class="btn btn-primary btn-block" onclick="closeModal(); startPinSetup();">تغيير الرمز</button>
          </div>
        `);
      } else {
        startPinSetup();
      }
    }
    function startPinSetup(){
      pinMode='setup'; pinBuffer=''; view.params.lockErr='';
      document.getElementById('app-root').classList.add('hidden');
      renderLock();
    }

    /* ============================================================
       INIT
       ============================================================ */
    function afterRender(){ /* reserved for post-render hooks */ }

    async function init(){
      try {
        await loadState();
        if(!state) state = defaultState();

        if(state.settings.pinEnabled && state.settings.pin){
          pinMode='unlock'; pinBuffer='';
          renderLock();
        } else {
          unlockApp();
        }
      } catch (err) {
        console.error("Init failed", err);
        document.body.innerHTML = `
          <div style="background:#16222B; color:#fff; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center; font-family:sans-serif;">
            <h2 style="color:#DDAE5C;">عذراً، حدث خطأ في التشغيل</h2>
            <p style="opacity:0.7; font-size:14px;">لم نتمكن من تحميل بياناتك بشكل صحيح.</p>
            <button onclick="localStorage.clear(); location.reload();" style="background:#DDAE5C; color:#000; border:none; padding:12px 24px; border-radius:10px; font-weight:bold; margin-top:20px;">إعادة ضبط التطبيق (مسح البيانات)</button>
          </div>
        `;
      }
    }
    init();
</script>
